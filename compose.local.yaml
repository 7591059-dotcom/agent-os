# Windows/macOS/Linux local tests. Use this file alone, not as a VPS override.
name: agentos-local

services:
  app:
    image: agentos:local-test
    pull_policy: never
    restart: "no"
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-sergey}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Start with START-LOCAL.cmd}
      MASTER_KEY: ${MASTER_KEY:?Start with START-LOCAL.cmd}
      PUBLIC_URL: http://localhost:8000
      SECURE_COOKIES: "false"
      DEMO_MODE: ${DEMO_MODE:-true}
      APP_DATA_DIR: /data
    command: [python, -m, uvicorn, "app.main:app", --host, "0.0.0.0", --port, "8000", --workers, "1", --no-proxy-headers, --no-access-log, --timeout-graceful-shutdown, "40"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - local_data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    stop_grace_period: 50s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Host':'localhost:8000'}); urllib.request.urlopen(r,timeout=5).read()"]
      interval: 5s
      timeout: 6s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  local_data:
    name: agentos_local_data
