name: agentos

services:
  app:
    build: .
    image: agentos:local
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-sergey}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Run scripts/configure.py first}
      MASTER_KEY: ${MASTER_KEY:?Run scripts/configure.py first}
      PUBLIC_URL: ${PUBLIC_URL:?Run scripts/configure.py first}
      SECURE_COOKIES: "true"
      DEMO_MODE: "false"
      APP_DATA_DIR: /data
    volumes:
      - agentos_data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    expose:
      - "8000"
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    stop_grace_period: 50s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request,urllib.parse; h=urllib.parse.urlparse(os.environ['PUBLIC_URL']).netloc; r=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Host':h}); urllib.request.urlopen(r,timeout=5).read()"
      interval: 20s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Run scripts/configure.py with your domain}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentos_data:
  caddy_data:
  caddy_config:
